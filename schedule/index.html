<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduling Poll &middot; Ames Grawert</title>
  <meta name="description" content="Pick the days that work for you." />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/schedule.css" />
</head>
<body>
  <main>
    <a href="/" id="back-link">&larr; amesgrawert.com</a>

    <div id="loading-msg" class="status-msg">Loading poll&hellip;</div>
    <div id="error-banner" class="error-banner" hidden></div>

    <section id="app" hidden>
      <h1 id="poll-title"></h1>
      <p class="subtitle">Pick the days that work for you, then save. Hover (or tap) a day to see who&rsquo;s free.</p>

      <div class="name-row">
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" autocomplete="name" placeholder="e.g. Ames" />
      </div>

      <div id="days-grid" class="days-grid"></div>

      <button id="submit-btn" type="button">Save my availability</button>
      <p id="save-status" class="status-msg" aria-live="polite"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
